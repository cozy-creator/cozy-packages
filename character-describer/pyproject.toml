[project]
name = "character-describer"
version = "0.6.1"
description = "One-sentence character identity descriptions from supplied reference images"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.26.4",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.10",
    "tokenizers>=0.23",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "character_describer:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["character_describer"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]
