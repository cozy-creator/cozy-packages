[project]
name = "cozy-video-assembly"
version = "1.0.12"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime[media]>=0.2.10,<1", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "video_assembly:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["video_assembly.py"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[tool.cozy]
organization = "paul"

[tool.mypy]
python_version = "3.12"
files = ["video_assembly.py", "live.py"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
