[project]
name = "cozy-video-assembly"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = ["cozy-runtime[media]==0.0.3", "msgspec>=0.19"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.3-py3-none-any.whl" }

[tool.mypy]
python_version = "3.12"
files = ["video_assembly.py", "live.py"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
