[project]
name = "minimax-h3-tools"
version = "2.4.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Upper bound, not taste: cr-114's static interface reader (0.5.2) reads the package
    # TREE, and Creator's published install re-derives the interface from a source directory
    # holding only package.toml, pyproject.toml and uv.lock — so a 0.5.2 lock cannot install.
    # Lift it when Creator describes an install from its committed interface.
    "cozy-runtime>=0.5.1,<0.5.2",
    "msgspec>=0.19",
    "numpy>=1.26",
    "torch>=2.13,<3",
]

[project.entry-points."cozy.application"]
default = "h3_tables.job:app"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4", "tensorfs>=0.3.0,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_tables"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
