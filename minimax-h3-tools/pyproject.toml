[project]
name = "minimax-h3-tools"
version = "2.22.2"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime>=0.30.0",
    "tensorfs>=0.13,<0.14",
    "msgspec>=0.19",
    "numpy>=1.26",
    "torch>=2.14",
]

[project.entry-points."cozy.application"]
default = "h3_tables.job:app"

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_tables"]

[tool.uv]
override-dependencies = ["cozy-runtime @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-canonical-candidate-20261021/cozy_runtime-0.30.0-cp312-abi3-manylinux_2_28_x86_64.whl", "tensorfs @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-authority-candidate-20261021/tensorfs-0.13.0-cp311-abi3-manylinux_2_28_x86_64.whl"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
