[project]
name = "minimax-h3-tools"
version = "2.12.11"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime>=0.18.44",
    "tensorfs>=0.3.58",
    "msgspec>=0.19",
    "numpy>=1.26",
    "torch>=2.14",
]

[project.entry-points."cozy.application"]
default = "h3_tables.job:app"

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_tables"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
