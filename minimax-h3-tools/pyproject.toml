[project]
name = "minimax-h3-tools"
version = "2.11.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.16.1,<1",
    "msgspec>=0.19",
    "numpy>=1.26",
    "torch>=2.13,<3",
]

[project.entry-points."cozy.application"]
default = "h3_tables.job:app"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4", "tensorfs>=0.3.35,<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_tables"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
