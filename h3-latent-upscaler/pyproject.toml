[project]
name = "h3-latent-upscaler"
version = "0.1.0"
description = "Learned spatial upscaling for normalized MiniMax H3 video latents"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[model-execution]>=0.23.24",
    "einops>=0.8",
    "msgspec>=0.19",
    "tensorfs>=0.6.1",
    "torch>=2.14",
]

[project.entry-points."cozy.application"]
default = "h3_latent_upscaler:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["h3_latent_upscaler"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
