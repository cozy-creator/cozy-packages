[project]
name = "h3"
version = "1.0.8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]==0.0.29",
    "cozy-eval==2.3.2",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pydantic-core==2.46.4",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tensorfs==0.0.7",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "torchvision==0.28.0",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "adaln_pruned.py",
    "conditioner.py",
    "gates.py",
    "h3.py",
    "official.py",
    "processor",
    "timestep-plans",
    "tokenizer",
]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.29-py3-none-any.whl" }
cozy-eval = { path = "vendor/cozy_eval-2.3.2-py3-none-any.whl" }
hf-xet = { path = "vendor/hf_xet-1.6.0-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" }
pydantic-core = { path = "vendor/pydantic_core-2.46.4-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
pyyaml = { path = "vendor/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
regex = { path = "vendor/regex-2026.7.19-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
safetensors = { path = "vendor/safetensors-0.8.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
shellingham = { path = "vendor/shellingham-1.5.4-py2.py3-none-any.whl" }
tensorfs = { path = "vendor/tensorfs-0.0.7-cp312-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
tokenizers = { path = "vendor/tokenizers-0.23.1-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
