[project]
name = "h3-endpoint"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "cozy-runtime[media]==0.0.1",
    "tensorfs==0.0.1",
    "cozy-eval==2.3.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=10",
    "torch==2.9.1+cu129",
    "torchvision==0.24.1+cu129",
    "transformers>=5.13,<6",
    "diffusers==0.40.0",
]

# The endpoint proof builds these three wheels from exact source commits into its temporary
# dependency input. They are not embedded in the project wheel; the canonical wheelhouse
# owner will name their bytes once that manifest exists.
[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.1-py3-none-any.whl" }
tensorfs = { path = "vendor/tensorfs-0.0.1-cp311-abi3-manylinux_2_34_x86_64.whl" }
cozy-eval = { path = "vendor/cozy_eval-2.3.0-py3-none-any.whl" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
