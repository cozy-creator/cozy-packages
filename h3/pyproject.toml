[project]
name = "h3"
version = "1.0.8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]>=0.1,<1",
    "cozy-eval>=0.1,<1",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pydantic-core==2.46.4",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tensorfs>=0.1,<1",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "adaln_pruned.py",
    "conditioner.py",
    "gates.py",
    "h3.py",
    "official.py",
    "processor",
    "timestep-plans",
    "tokenizer",
]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
