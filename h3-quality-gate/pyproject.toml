[project]
name = "h3-quality-gate"
version = "1.1.2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-eval>=0.1,<1",
    "cozy-runtime>=0.2.13,<1.0.0",
    "msgspec>=0.19",
]

[project.entry-points."cozy.application"]
default = "h3_quality_gate.job:app"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_quality_gate"]

[tool.cozy]
organization = "paul"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = "cozy_eval.*"
ignore_missing_imports = true
