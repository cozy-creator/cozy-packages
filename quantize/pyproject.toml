[project]
name = "quantize"
version = "1.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.1,<1.0.0",
    "msgspec>=0.19",
    "numpy>=1.26",
]

[project.entry-points."cozy.application"]
default = "tensorhub_quantize:app"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorhub_quantize"]

[tool.cozy]
organization = "paul"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
