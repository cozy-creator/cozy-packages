[project]
name = "quantize"
version = "1.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.1,<1.0.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "sdxl>=2.0,<3",
    "torch>=2.13,<3",
]

[project.entry-points."cozy.application"]
default = "tensorhub_quantize:app"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4", "tensorfs>=0.1,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorhub_quantize"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The serving package is a library for its derive jobs (cr-073): sdxl resolves from the
# paul org index (th-113), never a vendored copy. `explicit` keeps every other
# dependency on PyPI.
[tool.uv.sources]
sdxl = { index = "paul" }

[[tool.uv.index]]
name = "paul"
url = "http://127.0.0.1:8819/v1/index/paul/simple/"
explicit = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
