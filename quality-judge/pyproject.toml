# One dependency authority for this package: this file plus `uv.lock`. Cozy-owned libraries
# are immutable local wheels; everything else is an exact lock entry.
#
# The torch family is pinned to the SAME build H3 locks. Torch, torchvision and triton are
# one ABI-coupled unit — a package built against one torch fails with undefined-symbol
# errors under another — and decision #633 gives one PlatformTarget exactly one family, so a
# second family here would be a second substrate, never a per-package choice.
#
# Pillow, numpy and tokenizers are DIRECT dependencies here: `quality_judge.py` imports all
# three by name. Audio reaches this package already decoded by the Runtime media extra and
# is resampled in numpy, so there is no torchaudio and no torchvision in this closure.

[project]
name = "quality-judge"
version = "1.0.8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]==0.0.15",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=11",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tensorfs==0.0.5",
    "tokenizers>=0.22",
    "torch>=2.13,<3",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "quality_judge:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["quality_judge.py"]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.15-py3-none-any.whl" }
hf-xet = { path = "vendor/hf_xet-1.6.0-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" }
pyyaml = { path = "vendor/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
regex = { path = "vendor/regex-2026.7.19-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
safetensors = { path = "vendor/safetensors-0.8.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
shellingham = { path = "vendor/shellingham-1.5.4-py2.py3-none-any.whl" }
tensorfs = { path = "vendor/tensorfs-0.0.5-cp312-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
tokenizers = { path = "vendor/tokenizers-0.23.1-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
