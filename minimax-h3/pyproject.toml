[project]
name = "minimax-h3"
version = "1.10.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # A WINDOW, not a floor with a habitual ceiling, and the reason is the native source
    # interface: a job refuses `child_interface: native source interface changed` unless the
    # runtime's operation set digests equal Creator's embedded
    # `internal/nativeinterface/source.json`. The 0.11 window's retirement condition — that
    # Creator adopt `commit_file` and `source_files` — is MET: Creator's document now names
    # all five operations (cl-198), and Creator refuses a host runtime below 0.12.0 outright.
    # Raise the ceiling again when Creator's document next changes.
    "cozy-runtime[media]>=0.12.0,<0.13",
    "cozy-eval>=0.3.2,<1",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pydantic-core==2.46.4",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tensorfs>=0.3.0,<1",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "adaln_pruned.py",
    "assembly.py",
    "conditioner.py",
    "gates.py",
    "h3.py",
    "h3_diagnostics.py",
    "h3_activation_trace.py",
    "h3_resident_samples.py",
    "official.py",
    "processor",
    "timestep-plans",
    "tokenizer",
    "vae_tiles.py",
]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
