[project]
name = "minimax-h3"
version = "1.19.0"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media,minimax-h3]>=0.18.67",
    "cozy-eval>=0.7.3",
    "diffusers>=0.40.0",
    "hf-xet>=1.6.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pydantic-core>=2.46.4",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "qwen-image-2>=0.2.2",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.3.74",
    "tokenizers>=0.23.1",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "assembly.py",
    "gates.py",
    "h3.py",
    "long_form_state.py",
    "story.py",
    "h3_diagnostics.py",
    "h3_activation_trace.py",
    "h3_resident_samples.py",
    "timestep-plans",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# qwen-image-2 is this account's own package on the target Tensorhub, never PyPI. Creator
# writes the `tensorhub` index for the command's Hub and account; lock with `cozy package lock`.
[tool.uv.sources]
qwen-image-2 = { index = "tensorhub" }
