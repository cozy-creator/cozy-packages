[project]
name = "minimax-h3"
version = "1.10.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 0.11.2 is a WINDOW, not a floor with a habitual ceiling. Below it, `invocable_interface`
    # refuses the entrypoint metadata Creator itself provisions (a `list` default is not a
    # canonical field value there) and no job on this release can be discovered. At 0.12.0 the
    # runtime adds the `commit_file` and `source_files` native source operations, which no
    # Creator build has adopted — its embedded native-source document still names three — so
    # every job refuses with `child_interface: native source interface changed`. Raise the
    # ceiling when Creator's `internal/nativeinterface/source.json` carries those operations.
    "cozy-runtime[media]>=0.11.2,<0.12",
    "cozy-eval>=0.3.2,<1",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pydantic-core==2.46.4",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tensorfs>=0.3.0,<1",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "adaln_pruned.py",
    "assembly.py",
    "conditioner.py",
    "gates.py",
    "h3.py",
    "h3_diagnostics.py",
    "h3_activation_trace.py",
    "h3_resident_samples.py",
    "official.py",
    "processor",
    "timestep-plans",
    "tokenizer",
    "vae_tiles.py",
]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
