[project]
name = "h3-first-step"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["minimax-h3>=1.14.2,<2"]

[project.entry-points."cozy.application"]
default = "h3_first_step:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["h3_first_step.py"]

[tool.cozy]
organization = "paul"

[tool.uv]
default-groups = []

[tool.uv.sources]
minimax-h3 = {path = "../../../minimax-h3", editable = true}
