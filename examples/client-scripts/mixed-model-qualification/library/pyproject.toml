[project]
name = "cozy-mixed-model-qualification"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cozy-runtime>=0.18.0,<1",
  "msgspec>=0.19",
  "tensorfs>=0.3.42,<0.4",
  "torch>=2.13,<3",
]

[project.entry-points."cozy.application"]
default = "mixed_model_qualification:app"

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mixed_model_qualification"]
