[project]
name = "h3-scaling-profile"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime[media,minimax-h3]>=0.18.2,<1", "minimax-h3"]

[project.entry-points."cozy.application"]
default = "h3_scaling_profile:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["h3_scaling_profile.py", "profile_trace.py"]

[tool.uv.sources]
minimax-h3 = {path = "../../../minimax-h3"}

[tool.uv]
default-groups = []
