[project]
name = "sdxl-assessment-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime>=0.18.12,<1", "tensorfs>=0.3.42,<0.4", "cozy-eval[jobs,weights,judge]>=0.7.2,<0.8",
    "numpy>=2.5", "torch>=2.14", "torchvision>=0.29",
]

[project.entry-points."cozy.application"]
default = "sdxl_assessment_client.control_jobs:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl_assessment_client"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
