[project]
name = "h3-sol-exchange-diagnostic"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media,minimax-h3]>=0.18.2,<1",
    "minimax-h3",
]

[project.entry-points."cozy.application"]
default = "h3_sol_turbo:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["h3_sol_turbo.py", "exchange_diagnostic.py"]

[tool.uv]
default-groups = []
