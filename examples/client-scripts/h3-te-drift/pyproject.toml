[project]
name = "h3-te-drift"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.18.101",
    "msgspec>=0.19",
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "torch>=2.14",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "h3_te_drift:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["h3_te_drift.py"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
