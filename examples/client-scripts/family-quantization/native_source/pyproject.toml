[project]
name = "family-native-source"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.18.0,<1", "tensorfs>=0.3.42,<0.4", "numpy>=2"]
[project.entry-points."cozy.application"]
default = "family_native_source:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
only-include = ["family_native_source.py"]
