[project]
name = "attention-smoke"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.18.2,<1",
    "diffusers==0.40.0",
    "torch>=2.13,<3",
]

[project.entry-points."cozy.application"]
default = "smoke:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["smoke.py"]

[tool.uv]
default-groups = []
