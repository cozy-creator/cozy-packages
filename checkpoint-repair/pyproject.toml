[project]
name = "checkpoint-repair"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime>=0.2.32,<1.0.0",
    "msgspec>=0.19",
]

[project.entry-points."cozy.application"]
default = "checkpoint_repair.job:app"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4", "tensorfs>=0.3.18,<0.3.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkpoint_repair"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
