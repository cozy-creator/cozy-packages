[project]
name = "qwen-image-2"
version = "0.7.0"
description = "Cozy image generation and reference editing using Qwen-Image-2.1"
requires-python = ">=3.12"
dependencies = [
    # 0.24.4: the int8 lane (int8-convrot256/1, quantize_into) and fused DiT blocks.
    "cozy-runtime[media]>=0.25.0",
    "diffusers==0.41.0",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "safetensors>=0.8",
    "tokenizers>=0.23.1",
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "qwen_image_2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["qwen_image_2"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]
