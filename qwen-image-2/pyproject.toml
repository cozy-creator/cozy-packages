[project]
name = "qwen-image-2"
version = "0.10.0"
description = "Cozy image generation and reference editing using Qwen-Image-2.1"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "cozy-runtime>=0.30.0",
    "diffusers>=0.41,<0.42",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.13",
    "tokenizers>=0.23.1",
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "qwen_image_2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["qwen_image_2"]

[tool.uv]
override-dependencies = ["cozy-runtime @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-cap-candidate-20261020/cozy_runtime-0.30.0-cp312-abi3-manylinux_2_28_x86_64.whl", "tensorfs @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-cap-candidate-20261020/tensorfs-0.13.0-cp312-abi3-manylinux_2_28_x86_64.whl"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
