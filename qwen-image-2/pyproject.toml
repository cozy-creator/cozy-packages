[project]
name = "qwen-image-2"
version = "0.2.4"
description = "Cozy image generation and reference editing using Qwen-Image-2.1"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media,qwen-image21]>=0.18.89",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
]

[project.entry-points."cozy.application"]
default = "qwen_image_2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_image_2"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
