name: ci
# Fences + static analysis + the DETERMINISTIC CONFORMANCE ARMS.
#
# The testing rule as of #533: "No mock-heavy behavioral suites or tests of implementation
# trivia. Deterministic contract, arithmetic, codec, schema, and regression checks MUST run
# in CI. Live end-to-end evidence remains mandatory." The four defects that produced
# se-002's first garbage render — a reversed sampler sign, a generic temporal ratio, sigma
# grid points counted as model evaluations, and a double pixel rescale — were every one of
# them decidable on a CPU in milliseconds, and no manually-invoked script was running them.
# So they run here, on every push, and they cost seconds.
#
# Live evidence (a real render on a real card, viewed) is still mandatory and still cannot
# happen here. These arms make the CHEAP half unmissable; they do not replace the other.
#
# No GPU and no weights are needed here, and that is a PROPERTY being checked rather than a
# convenience: endpoint module scope must stay light enough for `describe` to read the
# surface in a disposable container.
#
# THE ONE THING CI CANNOT DO TODAY, said out loud rather than skipped quietly:
# `cozy-runtime-v2` is a PRIVATE repo and this workflow has no credential for it (the org
# holds no cross-repo token; `GITHUB_TOKEN` is scoped to this repository). So the steps
# that need the author surface installed — `describe --check` and a mypy that can SEE
# `cozy_runtime.author`'s types — run only when an owner adds `COZY_CI_TOKEN`. Until then
# they are the builder's, run against a pinned checkout in `.venv-check` (README), and the
# descriptor digest is recorded on ev-003. The steps below need nothing and are real.
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context is not available in an `if:` expression, so the token's
    # PRESENCE is lifted into the environment once and the two gated steps read that.
    env:
      COZY_CI_TOKEN: ${{ secrets.COZY_CI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13

      - name: Environment
        run: |
          uv venv --python 3.13
          uv pip install msgspec mypy ruff

      # Structural rules about the SOURCE: no runtime import, no artifact identifier in
      # code, nothing heavy at module scope, no test suite. These parse the files and need
      # no dependency at all.
      - name: Fences
        run: uv run --no-project python scripts/fence.py

      - name: Lint
        run: uv run --no-project ruff check h3/ quality-judge/ scripts/ sdxl/

      # Static analysis is REQUIRED (tracker README, owner directive 2026-08-25). Without
      # the private runtime installed, `cozy_runtime.*` resolves to Any here — the same
      # treatment cozy-eval gives torch, and recorded the same way rather than hidden
      # behind a per-module ignore_errors. The STRONG run, with the author surface's real
      # types, is `.venv-check/bin/python -m mypy` against the pinned checkout.
      - name: Types
        run: uv run --no-project mypy

      # The H3 reference semantics, checked against independently written upstream
      # expressions rather than against the endpoint's own call shapes — so the same arms
      # gate the diffusers rebase that replaces the hand port (#531). Every arm carries its
      # own RED CONTROL: the exact defective expression that shipped, asserted to disagree.
      #
      # numpy is the only addition to the environment above, and it is here because the
      # pixel arm exercises the SHIPPED conversion on a real array instead of a paraphrase
      # of it. No torch, no weights, no network, no card.
      - name: Conformance arms
        run: |
          uv pip install numpy
          uv run --no-project python scripts/h3-conform.py

      - name: Install the pinned author surface
        if: env.COZY_CI_TOKEN != ''
        env:
          COZY_RUNTIME_SHA: bf0442ddf91617449a37ea1d129c890cc35b5345
        run: |
          uv pip install 'protobuf>=6.31' 'grpcio>=1.76'
          uv pip install --no-deps \
            "cozy-runtime @ git+https://${COZY_CI_TOKEN}@github.com/cozy-creator/cozy-runtime-v2@${COZY_RUNTIME_SHA}"

      # The committed descriptor IS the surface contract. `--check` exits 13 naming the
      # pair that diverged, so a schema change that was not reviewed in a diff fails here.
      - name: Descriptor is current
        if: env.COZY_CI_TOKEN != ''
        run: uv run --no-project cozy-runtime describe --dir quality-judge --check
