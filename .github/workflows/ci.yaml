name: ci
# Automatic: one ~20 s job on master pushes that touch Python: syntax errors and undefined
# names across every package (Python has no compile step; a package's own proofs only see
# the modules they import).
# On demand, before a release (fences, types, locks, wheels, locked environments, H3 arms):
#   gh workflow run ci.yaml -R cozy-creator/packages --ref <branch> \
#     [-f packages='["sdxl"]'] [-f h3=false]
on:
  push:
    branches: [master]
    paths: ["**.py", "**/pyproject.toml", ".github/workflows/ci.yaml"]
  workflow_dispatch:
    inputs:
      packages:
        description: JSON list of package environments to qualify
        type: string
        default: '["anima","sdxl","minimax-h3-tools","qwen-image-2"]'
      h3:
        description: Run H3 deterministic conformance
        type: boolean
        default: true
      account_index:
        description: Account index the committed locks are bound to (`cozy package lock`)
        type: string
        default: https://tensorhub.com/v1/index/fidika/simple/
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.16.4 check --select E9,F63,F7,F82 .

  checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: uv python install 3.12

      # Check the same Runtime contract required by the H3 serving and producer packages.
      # The light checks need no model libraries. Locked environments below also
      # qualify installed-wheel imports and execution against each exact dependency set.
      - name: Environment
        run: |
          uv venv --python 3.12
          uv pip install --refresh-package cozy-runtime \
            "cozy-runtime>=0.18.67,<1" \
            "av==18.1.0" "mypy==2.3.1" "ruff==0.16.4" "numpy>=1.26"

      - name: Fences
        run: uv run --no-project python scripts/fence.py

      # Gate on bug classes only; auto-fixable style stays local (`ruff check --fix`).
      - name: Lint
        run: >-
          uv run --no-project ruff check --select E9,F,B --ignore F401
          anima/ minimax-h3/ scripts/ sdxl/ minimax-h3-tools/ qwen-image-2/ examples/

      - name: Types
        run: uv run --no-project mypy

      # A package with no `[project]` pyproject and no lock resolves no `ResolvedWheelSet`
      # and cannot publish at all, so a stale or absent lock is a release-blocking fact and
      # belongs in the cheap static job, not only in the heavy per-package ones.
      - name: Every package has a current lock
        run: |
          scripts/bind-account-index.sh "${{ inputs.account_index }}" anima minimax-h3 sdxl minimax-h3-tools qwen-image-2
          for package in anima minimax-h3 sdxl minimax-h3-tools qwen-image-2; do
            uv lock --check --project "$package"
          done

      - name: Every package builds a wheel
        run: |
          mkdir -p dist/packages
          for package in anima minimax-h3 sdxl minimax-h3-tools qwen-image-2; do
            mkdir "dist/packages/$package"
            uv build --project "$package" --wheel --out-dir "dist/packages/$package"
          done

      - name: The minimax-h3-tools wheel carries its job and assets
        run: |
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/job.py'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/whole-order.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/dit-full-specs.json'

      - name: Reference image wheel retains model licence and attribution
        run: |
          unzip -l dist/packages/qwen-image-2/qwen_image_2-*.whl | grep -F 'qwen_image_2/LICENSE.model.txt'
          unzip -l dist/packages/qwen-image-2/qwen_image_2-*.whl | grep -F 'qwen_image_2/Notice'

      # Each package has its own environment; native wheel requirements are checked
      # inside each environment before its compiled import proof below. Different package versions
      # are supported and must not be rejected by a global equality rule.
      - name: Native cohort validation accepts independent package environments
        run: uv run --no-project python scripts/torch_family.py --self-check

  h3-conformance:
    name: H3 deterministic conformance
    if: github.event_name == 'workflow_dispatch' && inputs.h3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: false
      - run: uv python install 3.12

      # --no-cache: a second copy of the ~7.6 GiB CUDA closure does not fit the runner disk.
      - name: Exact locked environment
        run: |
          scripts/bind-account-index.sh "${{ inputs.account_index }}" minimax-h3
          uv lock --check --project minimax-h3
          cd minimax-h3
          uv sync --locked --no-cache

      - name: The H3 environment owns a compatible native dependency cohort
        run: minimax-h3/.venv/bin/python scripts/torch_family.py

      - name: Arms
        run: minimax-h3/.venv/bin/python scripts/h3-conform.py

      - name: The exact text H3's encoder receives
        run: minimax-h3/.venv/bin/python scripts/h3-prompt-proof.py

      - name: Native long-form assembly and one-file delivery
        run: |
          minimax-h3/.venv/bin/python scripts/h3-assembly-proof.py "$RUNNER_TEMP/h3-assembly"
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"

      - name: PDD Ulysses parity at degrees two and four
        run: minimax-h3/.venv/bin/python scripts/h3-turbo-cp-proof.py

      - name: Reference fidelity survives conditioning
        run: CUDA_VISIBLE_DEVICES='' minimax-h3/.venv/bin/python scripts/h3-reference-fidelity-proof.py

      # The committed interface must not omit or contradict what the tree describes;
      # ordering, formatting and Runtime-added keys are ignored.
      - name: Package interface is current
        run: >-
          minimax-h3/.venv/bin/cozy-runtime --json --dir minimax-h3 describe |
          minimax-h3/.venv/bin/python scripts/interface_current.py
          minimax-h3/metadata/package-interface.json

      - name: The package builds and imports from its wheel
        run: |
          uv build --project minimax-h3 --wheel --out-dir dist/packages/minimax-h3
          uv pip install --python minimax-h3/.venv/bin/python --no-deps dist/packages/minimax-h3/*.whl
          minimax-h3/.venv/bin/python -P scripts/package_import.py minimax-h3 --installed

  package-locks:
    name: Package exact locked environments
    if: github.event_name == 'workflow_dispatch' && inputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: false
      - run: uv python install 3.12
      - name: Exact locked environment
        run: |
          scripts/bind-account-index.sh "${{ inputs.account_index }}" ${{ matrix.package }}
          uv lock --check --project ${{ matrix.package }}
          cd ${{ matrix.package }}
          uv sync --locked --no-cache --no-install-project
      # The compiled extensions are the ABI proof: they raise undefined-symbol errors
      # against the wrong torch, and nothing cheaper observes that.
      - name: The package owns a compatible native dependency cohort
        run: ${{ matrix.package }}/.venv/bin/python scripts/torch_family.py
      - name: The locked stack imports
        run: ${{ matrix.package }}/.venv/bin/python scripts/package_import.py ${{ matrix.package }}

      # The committed interface must not omit or contradict what the tree describes;
      # ordering, formatting and Runtime-added keys are ignored.
      - name: Package interface is current
        run: >-
          ${{ matrix.package }}/.venv/bin/cozy-runtime --json --dir ${{ matrix.package }} describe |
          ${{ matrix.package }}/.venv/bin/python scripts/interface_current.py
          ${{ matrix.package }}/metadata/package-interface.json
      # The progress meter is only observable by RUNNING the seam: se-026's denoise hook was
      # installed on a deepcopy of the block tree, so every static check stayed green while
      # the meter sat frozen for the whole render. These arms execute Diffusers' own loop.
      - name: Anima progress arms
        if: matrix.package == 'anima'
        run: anima/.venv/bin/python scripts/anima-conform.py

      - name: Reference image request and output contract
        if: matrix.package == 'qwen-image-2'
        run: qwen-image-2/.venv/bin/python scripts/qwen-image-2-conform.py

      - name: Reference image model equals the Diffusers pipeline
        if: matrix.package == 'qwen-image-2'
        run: CUDA_VISIBLE_DEVICES='' qwen-image-2/.venv/bin/python scripts/qwen-image-2-model-proof.py

      - name: H3 table construction order proofs
        if: matrix.package == 'minimax-h3-tools'
        run: |
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/order-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/stage-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/full-source-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/table-metadata-proof.py
          minimax-h3-tools/.venv/bin/python scripts/tensorfs_seeds.py
        env:
          PYTHONPATH: minimax-h3-tools/src

      - name: The package builds and imports from its wheel
        run: |
          uv build --project ${{ matrix.package }} --wheel --out-dir dist/packages/${{ matrix.package }}
          uv pip install --python ${{ matrix.package }}/.venv/bin/python --no-deps dist/packages/${{ matrix.package }}/*.whl
          ${{ matrix.package }}/.venv/bin/python -P scripts/package_import.py ${{ matrix.package }} --installed

      - name: The installed H3 AdaLN helper drives its sibling calls
        if: matrix.package == 'minimax-h3-tools'
        run: minimax-h3-tools/.venv/bin/python -P scripts/h3-adaln-interface-proof.py
