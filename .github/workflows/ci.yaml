name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12

      # Runtime installs from PyPI like any dependency. CI therefore sees the real author
      # types and media capability on every run; there is no secret-gated skipped-green path.
      # quantize imports the sdxl model class (cr-073); its published dependency resolves
      # from the paul org index (th-113), which is the standing dev hub and unreachable from
      # CI, so the repo's own sdxl source stands in for the import/describe checks here.
      - name: Environment
        run: |
          uv venv --python 3.12
          uv pip install \
            "cozy-runtime>=0.1,<1" \
            "av==18.1.0" "mypy==2.3.1" "ruff==0.16.4" "numpy>=1.26"
          uv pip install --no-deps ./sdxl

      - name: Fences
        run: uv run --no-project python scripts/fence.py

      - name: Lint
        run: >-
          uv run --no-project ruff check anima/ minimax-h3/ quality-judge/ scripts/ sdxl/
          h3-quality-gate/ minimax-h3-tools/ quantize/

      - name: Types
        run: uv run --no-project mypy

      - name: Descriptors are current
        run: |
          test "$(uv run --no-project cozy-runtime --json --dir minimax-h3 describe)" = "$(cat minimax-h3/package.descriptor.json)"
          test "$(uv run --no-project cozy-runtime --json --dir anima describe)" = "$(cat anima/package.descriptor.json)"
          test "$(uv run --no-project cozy-runtime --json --dir quality-judge describe)" = "$(cat quality-judge/package.descriptor.json)"
          test "$(uv run --no-project cozy-runtime --json --dir sdxl describe)" = "$(cat sdxl/package.descriptor.json)"
          test "$(uv run --no-project cozy-runtime --json --dir quantize describe)" = "$(cat quantize/package.descriptor.json)"
          test "$(uv run --no-project cozy-runtime --json --dir h3-quality-gate describe)" = "$(cat h3-quality-gate/package.descriptor.json)"

      # A package with no `[project]` pyproject and no lock resolves no `ResolvedWheelSet`
      # and cannot publish at all, so a stale or absent lock is a release-blocking fact and
      # belongs in the cheap static job, not only in the heavy per-package ones.
      # quantize is absent: its lock pins sdxl from the paul org index (th-113), whose dev
      # hub CI cannot reach, so `uv lock --check` cannot re-resolve here. Publish enforces
      # the exact lock instead (package-prepare re-derives in the locked environment and
      # the hub refuses drift); restore quantize when the org index has a CI-reachable URL.
      - name: Every package has a current lock
        run: |
          for package in anima h3 quality-judge sdxl video-assembly h3-quality-gate minimax-h3-tools; do
            uv lock --check --project "$package"
          done

      - name: Every package builds and imports from its wheel
        run: |
          mkdir -p dist/packages
          for package in anima h3 quality-judge sdxl video-assembly quantize h3-quality-gate minimax-h3-tools; do
            mkdir "dist/packages/$package"
            uv build --project "$package" --wheel --out-dir "dist/packages/$package"
          done
          uv pip install --python .venv/bin/python --no-deps dist/packages/*/*.whl
          .venv/bin/python -P - <<'PY'
          from pathlib import Path

          import anima, h3, h3_quality_gate, quality_judge, sdxl, tensorhub_quantize, video_assembly

          # h3_tables (minimax-h3-tools) imports torch at module scope, so its wheel is
          # installed above but imported only in its own locked environment (package-locks).
          for module in (anima, h3, h3_quality_gate, quality_judge, sdxl, tensorhub_quantize,
                         video_assembly):
              assert "site-packages" in str(module.__file__)
              assert module.app._registry
          h3_root = Path(h3.__file__).parent
          for asset in ("processor", "timestep-plans", "tokenizer"):
              assert (h3_root / asset).is_dir()
          PY
      - name: The minimax-h3-tools wheel carries its job and assets
        run: |
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/job.py'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/whole-order.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/dit-full-specs.json'

      # The torch family is ABI-coupled — torchvision's compiled ops link against torch's
      # C++ ABI — and #633 gives one PlatformTarget exactly ONE family. A package that
      # drifts onto a second torch fails with undefined-symbol errors at load, so the locks
      # are compared to each other here rather than discovered on a card.
      - name: One torch family across every package
        run: |
          uv run --no-project python scripts/torch_family.py

  h3-conformance:
    # Independent so a failure in static analysis cannot silently skip the red arms.
    name: H3 deterministic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12

      # This is the exact locked source environment and a CPU semantic proof. It is not the
      # separately required clean installed-wheel or GPU generation proof. --no-cache avoids
      # retaining a second copy of the roughly 7.6 GiB CUDA closure on the hosted runner.
      - name: Exact locked environment
        run: |
          uv lock --check --project minimax-h3
          cd minimax-h3
          uv sync --locked --no-cache --no-install-project

      - name: Arms
        run: minimax-h3/.venv/bin/python scripts/h3-conform.py

  package-locks:
    # Independent so a failure to materialize an exact dependency environment cannot hide
    # behind static analysis. The checks job separately builds and imports every project wheel.
    name: SDXL and quality-judge exact locked environments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # quantize is absent: its lock pins sdxl from the paul org index (th-113), whose
        # dev hub CI cannot reach, so the exact environment cannot materialize here. The
        # publish path materializes and proves that same lock locally; restore quantize
        # when the org index has a CI-reachable URL.
        package: [anima, sdxl, quality-judge, h3-quality-gate, minimax-h3-tools]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12
      - name: Exact locked environment
        run: |
          uv lock --check --project ${{ matrix.package }}
          cd ${{ matrix.package }}
          uv sync --locked --no-cache --no-install-project
      # The compiled extensions are the ABI proof: they raise undefined-symbol errors
      # against the wrong torch, and nothing cheaper observes that.
      - name: The locked stack imports
        run: ${{ matrix.package }}/.venv/bin/python scripts/package_import.py ${{ matrix.package }}
      - name: H3 table construction order proof
        if: matrix.package == 'minimax-h3-tools'
        run: minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/order-proof.py
        env:
          PYTHONPATH: minimax-h3-tools/src

  video-assembly:
    name: Video assembly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12
      - run: uv sync --project video-assembly --locked --group dev
      - run: uv run --project video-assembly ruff check video-assembly
      - run: uv run --project video-assembly ruff format --check video-assembly
      - run: cd video-assembly && uv run mypy
      - run: test "$(uv run --project video-assembly cozy-runtime --json --dir video-assembly describe)" = "$(cat video-assembly/package.descriptor.json)"
      - run: uv run --project video-assembly python video-assembly/live.py
