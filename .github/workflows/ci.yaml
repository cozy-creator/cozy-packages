name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12

      # H3 imports its libraries at module scope. Its committed lock supplies the
      # same dependency environment for metadata inspection and conformance.
      - name: Environment
        run: |
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.venv" uv sync --locked --project minimax-h3 --no-install-project
          uv pip install \
            "av==18.1.0" "mypy==2.3.1" "ruff==0.16.4" "numpy>=1.26"
          # Keep type checks focused on the public author API, as before; model
          # library behavior is covered by the separate locked conformance jobs.
          uv venv --python 3.12 .venv-types
          .venv/bin/python -c 'import importlib.metadata, pathlib; pathlib.Path("author-requirement.txt").write_text("cozy-runtime==" + importlib.metadata.version("cozy-runtime") + "\n")'
          uv pip install --python .venv-types/bin/python -r author-requirement.txt \
            "av==18.1.0" "mypy==2.3.1" "numpy>=1.26"

      - name: Fences
        run: uv run --no-project python scripts/fence.py

      - name: Lint
        run: >-
          uv run --no-project ruff check anima/ minimax-h3/ quality-judge/ scripts/ sdxl/
          h3-quality-gate/ minimax-h3-tools/ checkpoint-repair/ diagnostics/h3-vae-roundtrip/

      - name: Types
        run: .venv-types/bin/mypy

      - name: Package interfaces are current
        run: |
          test "$(uv run --no-project cozy-runtime --json --dir minimax-h3 describe)" = "$(cat minimax-h3/metadata/package-interface.json)"
          test "$(uv run --no-project cozy-runtime --json --dir anima describe)" = "$(cat anima/metadata/package-interface.json)"
          test "$(uv run --no-project cozy-runtime --json --dir quality-judge describe)" = "$(cat quality-judge/metadata/package-interface.json)"
          test "$(uv run --no-project cozy-runtime --json --dir sdxl describe)" = "$(cat sdxl/metadata/package-interface.json)"
          test "$(uv run --no-project cozy-runtime --json --dir h3-quality-gate describe)" = "$(cat h3-quality-gate/metadata/package-interface.json)"
          test "$(uv run --no-project cozy-runtime --json --dir checkpoint-repair describe)" = "$(cat checkpoint-repair/metadata/package-interface.json)"

      # A package with no `[project]` pyproject and no lock resolves no `ResolvedWheelSet`
      # and cannot publish at all, so a stale or absent lock is a release-blocking fact and
      # belongs in the cheap static job, not only in the heavy per-package ones.
      - name: Every package has a current lock
        run: |
          for package in anima minimax-h3 quality-judge sdxl video-assembly h3-quality-gate minimax-h3-tools checkpoint-repair; do
            uv lock --check --project "$package"
          done

      - name: Every package builds and imports from its wheel
        run: |
          mkdir -p dist/packages
          for package in anima minimax-h3 quality-judge sdxl video-assembly h3-quality-gate minimax-h3-tools checkpoint-repair; do
            mkdir "dist/packages/$package"
            uv build --project "$package" --wheel --out-dir "dist/packages/$package"
          done
          uv pip install --python .venv/bin/python --no-deps dist/packages/*/*.whl
          .venv/bin/python -P - <<'PY'
          from pathlib import Path

          import anima, h3, h3_quality_gate, quality_judge, sdxl, video_assembly
          import checkpoint_repair.job as checkpoint_repair

          # h3_tables (minimax-h3-tools) imports torch at module scope, so its wheel is
          # installed above but imported only in its own locked environment (package-locks).
          for module in (anima, h3, h3_quality_gate, quality_judge, sdxl, video_assembly, checkpoint_repair):
              assert "site-packages" in str(module.__file__)
              assert module.app._registry
          h3_root = Path(h3.__file__).parent
          for asset in ("processor", "timestep-plans", "tokenizer"):
              assert (h3_root / asset).is_dir()
          PY
      - name: Optional H3 diagnostics build and expose bounded assets
        run: |
          mkdir -p diagnostics/h3-vae-roundtrip/dependencies
          cp dist/packages/minimax-h3/*.whl diagnostics/h3-vae-roundtrip/dependencies/
          uv lock --check --project diagnostics/h3-vae-roundtrip
          uv build --project diagnostics/h3-vae-roundtrip --wheel --out-dir dist/diagnostic
          uv pip install --python .venv/bin/python --no-deps dist/diagnostic/*.whl
          .venv/bin/cozy-runtime --json --dir diagnostics/h3-vae-roundtrip describe > dist/diagnostic/interface.json

      - name: The minimax-h3-tools wheel carries its job and assets
        run: |
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/job.py'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/whole-order.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/dit-full-specs.json'

      # The torch family is ABI-coupled — torchvision's compiled ops link against torch's
      # C++ ABI — and #633 gives one PlatformTarget exactly ONE family. A package that
      # drifts onto a second torch fails with undefined-symbol errors at load, so the locks
      # are compared to each other here rather than discovered on a card.
      - name: One torch family across every package
        run: |
          uv run --no-project python scripts/torch_family.py

  h3-conformance:
    # Independent so a failure in static analysis cannot silently skip the red arms.
    name: H3 deterministic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12

      # This is the exact locked source environment and a CPU semantic proof. It is not the
      # separately required clean installed-wheel or GPU generation proof. --no-cache avoids
      # retaining a second copy of the roughly 7.6 GiB CUDA closure on the hosted runner.
      - name: Exact locked environment
        run: |
          uv lock --check --project minimax-h3
          cd minimax-h3
          uv sync --locked --no-cache --no-install-project

      - name: Arms
        run: minimax-h3/.venv/bin/python scripts/h3-conform.py

      - name: Diagnostic hooks preserve outputs and stop explicitly
        run: PYTHONPATH=minimax-h3 minimax-h3/.venv/bin/python scripts/h3-activation-proof.py

      - name: Reference fidelity survives conditioning
        run: minimax-h3/.venv/bin/python scripts/h3-reference-fidelity-proof.py

  package-locks:
    # Independent so a failure to materialize an exact dependency environment cannot hide
    # behind static analysis. The checks job separately builds and imports every project wheel.
    name: SDXL and quality-judge exact locked environments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [anima, sdxl, quality-judge, h3-quality-gate, minimax-h3-tools, checkpoint-repair]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12
      - name: Exact locked environment
        run: |
          uv lock --check --project ${{ matrix.package }}
          cd ${{ matrix.package }}
          uv sync --locked --no-cache --no-install-project
      # The compiled extensions are the ABI proof: they raise undefined-symbol errors
      # against the wrong torch, and nothing cheaper observes that.
      - name: The locked stack imports
        run: ${{ matrix.package }}/.venv/bin/python scripts/package_import.py ${{ matrix.package }}
      # The progress meter is only observable by RUNNING the seam: se-026's denoise hook was
      # installed on a deepcopy of the block tree, so every static check stayed green while
      # the meter sat frozen for the whole render. These arms execute Diffusers' own loop.
      - name: Anima progress arms
        if: matrix.package == 'anima'
        run: anima/.venv/bin/python scripts/anima-conform.py

      # `Model.warm` is only observable by RUNNING it: the package's own constructors at
      # toy widths, under the author harness the executor's warm path is built from.
      - name: Warm arms
        if: matrix.package == 'anima' || matrix.package == 'sdxl'
        run: ${{ matrix.package }}/.venv/bin/python scripts/warm-conform.py ${{ matrix.package }}

      - name: H3 table construction order proof
        if: matrix.package == 'minimax-h3-tools'
        run: |
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/order-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/stage-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/full-source-proof.py
          minimax-h3-tools/.venv/bin/python scripts/tensorfs_seeds.py
        env:
          PYTHONPATH: minimax-h3-tools/src

      - name: Native checkpoint row repair and resume
        if: matrix.package == 'checkpoint-repair'
        run: checkpoint-repair/.venv/bin/python scripts/h3-repair-proof.py

  video-assembly:
    name: Video assembly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12
      - run: uv sync --project video-assembly --locked --group dev
      - run: uv run --project video-assembly ruff check video-assembly
      - run: uv run --project video-assembly ruff format --check video-assembly
      - run: cd video-assembly && uv run mypy
      - run: test "$(uv run --project video-assembly cozy-runtime --json --dir video-assembly describe)" = "$(cat video-assembly/metadata/package-interface.json)"
      - run: uv run --project video-assembly python video-assembly/live.py
