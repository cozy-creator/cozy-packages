name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12

      # Runtime installs from PyPI like any dependency, at the packages' own floor (0.4.3:
      # `Model.warm`, `fakes.warm_with_fakes`). CI therefore sees the real author types and
      # media capability on every run; there is no secret-gated skipped-green path.
      # No model library is installed here: every import is at module scope (se-041), so
      # `describe` and the installed-wheel import run in each package's LOCKED environment
      # below — the one Creator describes in at publish and install.
      - name: Environment
        run: |
          uv venv --python 3.12
          uv pip install \
            "cozy-runtime>=0.4.3,<1" \
            "av==18.1.0" "mypy==2.3.1" "ruff==0.16.4" "numpy>=1.26"

      - name: Fences
        run: uv run --no-project python scripts/fence.py

      # The contract schema is Runtime's, so the committed assets are proven against the
      # CURRENT release here rather than the package's own locked floor (se-037).
      - name: H3 execution contract proof
        run: uv run --no-project python scripts/h3-contract-proof.py

      - name: Lint
        run: >-
          uv run --no-project ruff check anima/ minimax-h3/ scripts/ sdxl/
          minimax-h3-tools/ checkpoint-repair/ diagnostics/h3-vae-roundtrip/

      - name: Types
        run: uv run --no-project mypy

      # A package with no `[project]` pyproject and no lock resolves no `ResolvedWheelSet`
      # and cannot publish at all, so a stale or absent lock is a release-blocking fact and
      # belongs in the cheap static job, not only in the heavy per-package ones.
      - name: Every package has a current lock
        run: |
          for package in anima minimax-h3 sdxl minimax-h3-tools checkpoint-repair; do
            uv lock --check --project "$package"
          done

      - name: Every package builds a wheel
        run: |
          mkdir -p dist/packages
          for package in anima minimax-h3 sdxl minimax-h3-tools checkpoint-repair; do
            mkdir "dist/packages/$package"
            uv build --project "$package" --wheel --out-dir "dist/packages/$package"
          done

      - name: The minimax-h3-tools wheel carries its job and assets
        run: |
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/job.py'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/whole-order.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/dit-full-specs.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/execution.sm90-attn8.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/execution.sm90-fa3.json'
          unzip -l dist/packages/minimax-h3-tools/minimax_h3_tools-*.whl | grep -F 'h3_tables/assets/execution.sm90-fa3.json'

      # The torch family is ABI-coupled — torchvision's compiled ops link against torch's
      # C++ ABI — and #633 gives one PlatformTarget exactly ONE family. A package that
      # drifts onto a second torch fails with undefined-symbol errors at load, so the locks
      # are compared to each other here rather than discovered on a card.
      - name: One torch family across every package
        run: |
          uv run --no-project python scripts/torch_family.py

  h3-conformance:
    # Independent so a failure in static analysis cannot silently skip the red arms.
    name: H3 deterministic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12

      # This is the exact locked source environment and a CPU semantic proof. It is not the
      # separately required clean installed-wheel or GPU generation proof. --no-cache avoids
      # retaining a second copy of the roughly 7.6 GiB CUDA closure on the hosted runner.
      - name: Exact locked environment
        run: |
          uv lock --check --project minimax-h3
          cd minimax-h3
          uv sync --locked --no-cache --no-install-project

      - name: Arms
        run: minimax-h3/.venv/bin/python scripts/h3-conform.py

      - name: Diagnostic hooks preserve outputs and stop explicitly
        run: PYTHONPATH=minimax-h3 minimax-h3/.venv/bin/python scripts/h3-activation-proof.py

      # `describe` reads the package through its module-scope imports, so it runs here, in
      # the locked environment Creator describes in at publish and install (se-041).
      - name: Package interface is current
        run: test "$(minimax-h3/.venv/bin/cozy-runtime --json --dir minimax-h3 describe)" = "$(cat minimax-h3/metadata/package-interface.json)"

      - name: The package builds and imports from its wheel
        run: |
          uv build --project minimax-h3 --wheel --out-dir dist/packages/minimax-h3
          uv pip install --python minimax-h3/.venv/bin/python --no-deps dist/packages/minimax-h3/*.whl
          minimax-h3/.venv/bin/python -P scripts/package_import.py minimax-h3 --installed

      - name: Optional H3 diagnostics build and expose bounded assets
        run: |
          mkdir -p diagnostics/h3-vae-roundtrip/dependencies
          cp dist/packages/minimax-h3/*.whl diagnostics/h3-vae-roundtrip/dependencies/
          uv lock --check --project diagnostics/h3-vae-roundtrip
          uv build --project diagnostics/h3-vae-roundtrip --wheel --out-dir dist/diagnostic
          uv pip install --python minimax-h3/.venv/bin/python --no-deps dist/diagnostic/*.whl
          minimax-h3/.venv/bin/cozy-runtime --json --dir diagnostics/h3-vae-roundtrip describe > dist/diagnostic/interface.json

  package-locks:
    # Independent so a failure to materialize an exact dependency environment cannot hide
    # behind static analysis. The checks job separately builds and imports every project wheel.
    name: Package exact locked environments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [anima, sdxl, minimax-h3-tools, checkpoint-repair]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - run: uv python install 3.12
      - name: Exact locked environment
        run: |
          uv lock --check --project ${{ matrix.package }}
          cd ${{ matrix.package }}
          uv sync --locked --no-cache --no-install-project
      # The compiled extensions are the ABI proof: they raise undefined-symbol errors
      # against the wrong torch, and nothing cheaper observes that.
      - name: The locked stack imports
        run: ${{ matrix.package }}/.venv/bin/python scripts/package_import.py ${{ matrix.package }}

      # `describe` reads the package through its module-scope imports, so it runs here, in
      # the locked environment Creator describes in at publish and install (se-041).
      - name: Package interface is current
        run: test "$(${{ matrix.package }}/.venv/bin/cozy-runtime --json --dir ${{ matrix.package }} describe)" = "$(cat ${{ matrix.package }}/metadata/package-interface.json)"
      # The progress meter is only observable by RUNNING the seam: se-026's denoise hook was
      # installed on a deepcopy of the block tree, so every static check stayed green while
      # the meter sat frozen for the whole render. These arms execute Diffusers' own loop.
      - name: Anima progress arms
        if: matrix.package == 'anima'
        run: anima/.venv/bin/python scripts/anima-conform.py

      # `Model.warm` is only observable by RUNNING it: the package's own constructors at
      # toy widths, under the author harness the executor's warm path is built from.
      - name: Warm arms
        if: matrix.package == 'anima' || matrix.package == 'sdxl'
        run: ${{ matrix.package }}/.venv/bin/python scripts/warm-conform.py ${{ matrix.package }}

      - name: H3 table construction order and attention-lane proofs
        if: matrix.package == 'minimax-h3-tools'
        run: |
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/order-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/stage-proof.py
          minimax-h3-tools/.venv/bin/python minimax-h3-tools/scripts/full-source-proof.py
          minimax-h3-tools/.venv/bin/python scripts/tensorfs_seeds.py
          minimax-h3-tools/.venv/bin/python scripts/h3-attention-lane-proof.py
        env:
          PYTHONPATH: minimax-h3-tools/src

      - name: Native checkpoint row repair and resume
        if: matrix.package == 'checkpoint-repair'
        run: checkpoint-repair/.venv/bin/python scripts/h3-repair-proof.py

      - name: The package builds and imports from its wheel
        run: |
          uv build --project ${{ matrix.package }} --wheel --out-dir dist/packages/${{ matrix.package }}
          uv pip install --python ${{ matrix.package }}/.venv/bin/python --no-deps dist/packages/${{ matrix.package }}/*.whl
          ${{ matrix.package }}/.venv/bin/python -P scripts/package_import.py ${{ matrix.package }} --installed
