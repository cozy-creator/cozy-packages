[project]
name = "codex-sdxl-latent-diagnostic"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "cozy-runtime[media]>=0.18.102", "diffusers==0.40.0", "torch==2.14.0",
  "transformers==5.16.1", "tokenizers>=0.23.1", "tensorfs>=0.3.93",
  "hidiffusion>=0.1.10", "msgspec>=0.19", "numpy>=2.0", "pyyaml>=6.0.3",
  "regex>=2026.7.19", "safetensors>=0.8.0", "hf-xet>=1.6.0", "shellingham>=1.5.4"
]
[project.entry-points."cozy.application"]
default = "sdxl_latent_diagnostic:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["sdxl_latent_diagnostic"]
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

