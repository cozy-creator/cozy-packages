[project]
name = "h3-vae-diagnostic"
version = "1.0.10"
requires-python = ">=3.12,<3.13"
dependencies = [
    "minimax-h3==1.1.11",
    "cozy-runtime[media]>=0.2.34,<1",
    "cozy-eval>=0.3.2,<1",
    "diffusers==0.40.0",
    "msgspec>=0.19",
    "safetensors>=0.7",
    "numpy>=1.26",
    "pillow>=12",
    "torch>=2.13,<3",
]

[project.entry-points."cozy.application"]
default = "vae_diagnostic:app"

[tool.uv.sources]
minimax-h3 = { path = "dependencies/minimax_h3-1.1.11-py3-none-any.whl" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["vae_diagnostic.py", "resident_samples.py", "activation_trace.py"]

[tool.cozy]
organization = "paul"
