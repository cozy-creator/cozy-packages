[project]
name = "h3-vae-diagnostic"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["minimax-h3==1.1.9", "cozy-runtime[media]==0.2.29"]

[project.entry-points."cozy.application"]
default = "vae_diagnostic:app"

[tool.uv.sources]
minimax-h3 = { path = "../../minimax-h3" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["vae_diagnostic.py"]

[tool.cozy]
organization = "paul"
