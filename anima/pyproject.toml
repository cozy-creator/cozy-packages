[project]
name = "anima-package"
version = "0.1.2"
description = "Anima anime text-to-image package for Cozy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]==0.0.5",
    "diffusers==0.40.0",
    "msgspec>=0.19",
    "numpy>=2.0",
    "sentencepiece>=0.2",
    "torch==2.13.0",
    "transformers==5.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anima"]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.5-py3-none-any.whl" }

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[tool.mypy]
python_version = "3.12"
files = ["anima"]
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
