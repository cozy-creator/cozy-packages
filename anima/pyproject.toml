[project]
name = "anima"
version = "0.1.19"
description = "Anima anime text-to-image package for Cozy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]==0.0.20",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "anima:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anima"]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.20-py3-none-any.whl" }
hf-xet = { path = "vendor/hf_xet-1.6.0-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" }
pyyaml = { path = "vendor/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
regex = { path = "vendor/regex-2026.7.19-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
safetensors = { path = "vendor/safetensors-0.8.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
shellingham = { path = "vendor/shellingham-1.5.4-py2.py3-none-any.whl" }
tokenizers = { path = "vendor/tokenizers-0.23.1-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[tool.mypy]
python_version = "3.12"
files = ["anima"]
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
