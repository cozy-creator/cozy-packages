[project]
name = "anima"
version = "0.10.2"
description = "Anima anime text-to-image package for Cozy"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "cozy-runtime>=0.27.0",
    "diffusers>=0.40.0",
    "hf-xet>=1.6.0",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.10",
    "tokenizers>=0.23.1",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "anima:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anima"]

[tool.uv]
override-dependencies = ["cozy-runtime @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-candidate-20261020/cozy_runtime-0.30.0-cp312-abi3-manylinux_2_28_x86_64.whl", "tensorfs @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-candidate-20261020/tensorfs-0.13.0-cp312-abi3-manylinux_2_28_x86_64.whl"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[tool.mypy]
python_version = "3.12"
files = ["anima"]
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
