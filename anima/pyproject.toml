[project]
name = "anima"
version = "0.2.3"
description = "Anima anime text-to-image package for Cozy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]>=0.4.3,<1",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tensorfs>=0.3.0,<1",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "anima:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anima"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]

[tool.mypy]
python_version = "3.12"
files = ["anima"]
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
