# Not a distributed package: endpoints are installed from this repo by `cozy install`, and
# nothing here is published to an index. This file exists to hold the STATIC ANALYSIS
# configuration, which is required (tracker README, owner directive 2026-08-25) — the
# no-tests rule bans test suites, not type checking.

[tool.mypy]
python_version = "3.13"
files = ["h3", "quality-judge", "sdxl", "scripts"]
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# Static checks install the exact vendored, typed Runtime wheel. Heavy model libraries remain
# absent because module-scope imports are forbidden and descriptor analysis must stay light.
[[tool.mypy.overrides]]
module = [
    "torch.*", "torchvision.*", "transformers.*", "tokenizers.*", "numpy.*", "PIL.*",
    "safetensors.*", "diffusers.*", "tfsbench", "tensorfs", "tensorfs.*", "cozy_eval.*",
    "av", "av.*",
]
ignore_missing_imports = true

# These two older endpoints subclass optional Torch surfaces that are intentionally absent
# from the light checking environment. H3's Runtime author surface remains fully typed.
[[tool.mypy.overrides]]
module = ["quality_judge", "sdxl"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[tool.ruff]
line-length = 100
src = ["h3", "quality-judge", "sdxl", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
