# Not a distributed package: this repository contains first-party package source trees,
# while each child project owns its own lock and publication. This file holds STATIC ANALYSIS
# configuration, which is required (tracker README, owner directive 2026-08-25) — the
# no-tests rule bans test suites, not type checking.

[tool.mypy]
python_version = "3.12"
files = [
    "anima", "minimax-h3", "quality-judge", "sdxl", "scripts",
    "h3-quality-gate/src", "minimax-h3-tools/src", "quantize/src",
]
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# Static checks install the typed Runtime distribution from PyPI. Heavy model libraries remain
# absent because module-scope imports are forbidden and descriptor analysis must stay light.
[[tool.mypy.overrides]]
module = [
    "torch.*", "torchvision.*", "transformers.*", "tokenizers.*", "numpy.*", "PIL.*",
    "safetensors.*", "diffusers.*", "tfsbench", "tensorfs", "tensorfs.*", "cozy_eval.*",
    "av", "av.*",
]
ignore_missing_imports = true

# h3_tables decorates with `@torch.inference_mode()`; torch is intentionally absent from
# the light checking environment, so the decorator is untyped here and fully typed in the
# package's own locked venv.
[[tool.mypy.overrides]]
module = ["h3_tables", "h3_tables.*"]
disallow_untyped_decorators = false

# These two older packages subclass optional Torch surfaces that are intentionally absent
# from the light checking environment. H3's Runtime author surface remains fully typed.
[[tool.mypy.overrides]]
module = ["anima", "quality_judge", "sdxl"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[tool.ruff]
line-length = 100
src = [
    "anima", "minimax-h3", "quality-judge", "sdxl", "scripts",
    "h3-quality-gate", "minimax-h3-tools", "quantize",
]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
