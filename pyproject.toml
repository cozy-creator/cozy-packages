# Not a distributed package: endpoints are installed from this repo by `cozy install`, and
# nothing here is published to an index. This file exists to hold the STATIC ANALYSIS
# configuration, which is required (tracker README, owner directive 2026-08-25) — the
# no-tests rule bans test suites, not type checking.

[tool.mypy]
python_version = "3.13"
files = ["quality-judge", "scripts"]
strict = true
warn_unreachable = true
disallow_any_generics = true
implicit_reexport = false

# The model libraries an endpoint constructs through are OPTIONAL to type checking: the
# checking venv holds cozy-runtime, msgspec and nothing heavy, exactly like the container
# `describe` runs in. `fence.py::light-module-scope` is what actually holds the packaging
# rule; mypy never could. transformers additionally publishes no usable stubs for the
# dynamic `Auto*` surface, so a stub package would be a fiction with a version number.
[[tool.mypy.overrides]]
module = [
    "torch.*", "torchvision.*", "transformers.*", "tokenizers.*", "numpy.*", "PIL.*",
    "safetensors.*", "tfsbench", "tensorfs", "tensorfs.*", "cozy_eval.*",
]
ignore_missing_imports = true

# `cozy_runtime` is the author surface, and it SHIPS types — this is not an untyped
# dependency, it is a private repo GitHub Actions has no credential for (see
# .github/workflows/ci.yaml). So CI checks this code with the surface as Any, and the
# builder checks it against the real thing in `.venv-check`. Recorded here beside the
# config rather than hidden, because the difference is real: the CI run cannot catch a
# wrong argument to `loader.construct` and the local one can.
[[tool.mypy.overrides]]
module = ["cozy_runtime", "cozy_runtime.*"]
ignore_missing_imports = true

# The two consequences of the line above, loosened HERE rather than papered over at each
# site: with the author surface untyped, `Model` is an Any base class and `@app.entrypoint`
# is an untyped decorator, so strict mode reports every model class and every handler. Both
# are true statements about the CI environment and false statements about the code —
# cozy-eval loosens the identical pair for the two modules that subclass a torch class.
# Everything else stays strict, and no module carries `ignore_errors`.
[[tool.mypy.overrides]]
module = ["quality_judge"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
src = ["quality-judge", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
