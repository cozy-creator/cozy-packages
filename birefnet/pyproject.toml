[project]
name = "birefnet"
version = "0.2.0"
description = "BiRefNet background removal for supplied character references"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.25.0",
    "einops>=0.8",
    "kornia>=0.8",
    "msgspec>=0.19",
    "pillow>=12",
    "timm>=1.0",
    "tensorfs>=0.10",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "birefnet:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birefnet"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]
