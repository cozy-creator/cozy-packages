[project]
name = "qwen3.5"
version = "0.2.0"
description = "Qwen3.5: single-turn questions about text, images and videos"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[media]>=0.32",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tensorfs>=0.15",
    "tokenizers>=0.23",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "qwen3_5:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen3_5"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]
