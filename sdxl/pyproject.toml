# One dependency authority for this package: this file plus `uv.lock`.
#
# The lock defines the isolated package environment. Compatible dependencies can reuse
# the worker cache; base-image versions are accelerators, not compatibility limits.

[project]
name = "sdxl"
version = "2.5.0"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[adapters,media]>=0.18.101",
    "diffusers>=0.40.0",
    "hf-xet>=1.6.0",
    "hidiffusion>=0.1.10",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.3.74",
    "tokenizers>=0.23.1",
    "torch>=2.14",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "sdxl:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]
