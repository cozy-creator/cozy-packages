# One dependency authority for this package: this file plus `uv.lock`.
#
# Torch and Runtime are base-owned requirements. The lock records compatibility; package
# publication never overlays another copy over the selected base worker image.

[project]
name = "sdxl"
version = "2.3.7"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]>=0.18.0",
    "diffusers>=0.40.0",
    "hf-xet>=1.6.0",
    "hidiffusion>=0.1.10",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "shellingham>=1.5.4",
    "tensorfs>=0.3.42",
    "tokenizers>=0.23.1",
    "torch>=2.13",
    "transformers>=5.16.1",
]

[project.entry-points."cozy.application"]
default = "sdxl:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]
