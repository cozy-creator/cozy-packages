# One dependency authority for this package: this file plus `uv.lock`. Cozy-owned libraries
# are immutable local wheels; everything else is an exact lock entry.
#
# Torch and Runtime are base-owned requirements. The lock records compatibility; package
# publication never overlays another copy over the selected base worker image.

[project]
name = "sdxl"
version = "2.0.13"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media,model-execution]>=0.0.29,<1.0.0",
    "diffusers==0.40.0",
    "hf-xet==1.6.0",
    "hidiffusion==0.1.10",
    "msgspec>=0.19",
    "numpy>=2.0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "tokenizers==0.23.1",
    "torch>=2.13,<3",
    "transformers==5.16.1",
]

[project.entry-points."cozy.application"]
default = "sdxl:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl"]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.29-py3-none-any.whl" }
tensorfs = { path = "vendor/tensorfs-0.0.7-cp312-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
hf-xet = { path = "vendor/hf_xet-1.6.0-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" }
pyyaml = { path = "vendor/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
regex = { path = "vendor/regex-2026.7.19-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" }
safetensors = { path = "vendor/safetensors-0.8.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
shellingham = { path = "vendor/shellingham-1.5.4-py2.py3-none-any.whl" }
tokenizers = { path = "vendor/tokenizers-0.23.1-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
# Temporary resolver source anchor until TensorFS is on PyPI. Runtime's model-execution extra,
# not package metadata or package code, owns the execution dependency.
dev = ["mypy==2.3.1", "ruff==0.16.4", "tensorfs==0.0.7"]
