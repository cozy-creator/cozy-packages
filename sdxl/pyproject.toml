# One dependency authority for this package: this file plus `uv.lock`. Cozy-owned libraries
# are immutable local wheels; everything else is an exact lock entry.
#
# Torch and Runtime are base-owned requirements. The lock records compatibility; package
# publication never overlays another copy over the selected base worker image.

[project]
name = "sdxl-package"
version = "1.1.9"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime[media]==0.0.5",
    "diffusers==0.40.0",
    "hidiffusion==0.1.10",
    "msgspec>=0.19",
    "numpy>=2.0",
    "torch==2.13.0",
    "transformers==5.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdxl"]

[tool.uv.sources]
cozy-runtime = { path = "vendor/cozy_runtime-0.0.5-py3-none-any.whl" }

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.4"]
