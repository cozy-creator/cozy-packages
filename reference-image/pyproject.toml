[project]
name = "reference-image"
version = "0.2.0"
description = "Cozy reference image generation using Qwen-Image-2.1"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[qwen-image21]>=0.18.24",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
]

[project.entry-points."cozy.application"]
default = "reference_image:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference_image"]

[tool.cozy]
organization = "paul"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
