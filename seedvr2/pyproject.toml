[project]
name = "seedvr2"
version = "0.6.1"
description = "SeedVR2 7B temporally consistent video restoration"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "cozy-runtime>=0.27.0",
    "diffusers>=0.40",
    "einops>=0.8",
    "msgspec>=0.19",
    "numpy>=2",
    "omegaconf>=2.3",
    "pillow>=12",
    "rotary-embedding-torch>=0.5.3",
    "tensorfs>=0.10",
    "torch>=2.14",
    "torchvision>=0.29",
]

[project.entry-points."cozy.application"]
default = "seedvr2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seedvr2"]

[tool.uv]
override-dependencies = ["cozy-runtime @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-candidate-20261020/cozy_runtime-0.30.0-cp312-abi3-manylinux_2_28_x86_64.whl", "tensorfs @ https://github.com/cozy-creator/cozy-runtime/releases/download/varena-slim-candidate-20261020/tensorfs-0.13.0-cp312-abi3-manylinux_2_28_x86_64.whl"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
